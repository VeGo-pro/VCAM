name: Build VCam

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show environment
      run: |
        echo "Xcode path:"
        xcode-select -p
        echo "Xcode version:"
        xcodebuild -version 2>/dev/null || echo "xcodebuild not available"
        echo "iPhoneOS SDKs:"
        ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>/dev/null || echo "No Xcode SDKs found"
        echo "xcrun SDK path:"
        xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "xcrun failed"
        which clang make tar cpio gzip

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
        ls "$THEOS/sdks/" 2>/dev/null || echo "Theos sdks dir empty"

    - name: Link Xcode SDK into Theos
      run: |
        mkdir -p "$THEOS/sdks"
        XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
        if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
          SDK_BASENAME=$(basename "$XCODE_SDK")
          ln -s "$XCODE_SDK" "$THEOS/sdks/$SDK_BASENAME"
          echo "Linked SDK: $SDK_BASENAME"
        else
          echo "WARNING: No Xcode SDK found, will try Theos auto-detection"
        fi
        echo "Theos sdks:"
        ls -la "$THEOS/sdks/"

    - name: Build package
      run: |
        make clean
        make package FINALPACKAGE=1
        echo "=== Packages ==="
        ls -lh packages/

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb | head -1)
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb
        tar -xf data.tar.* 2>/dev/null
        find . -name "*.dylib" -exec cp {} VCam.dylib \;
        ls -lh

    - uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb

    - uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
