name: Build VCam

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
    - uses: actions/checkout@v4

    - name: Check environment
      run: |
        echo "=== Workspace ==="
        pwd
        ls -la
        echo "=== Xcode ==="
        xcode-select -p 2>&1 || true
        xcrun --sdk iphoneos --show-sdk-path 2>&1 || true
        echo "=== THEOS env ==="
        echo "THEOS=$THEOS"

    - name: Install Theos (official installer)
      run: |
        export THEOS=${{ github.workspace }}/theos
        rm -rf "$THEOS"
        # Use official Theos installer
        curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos
        bash /tmp/install-theos
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
        echo "=== Theos installed ==="
        ls "$THEOS" 2>&1 | head -20
        echo "=== Theos sdks ==="
        ls "$THEOS/sdks/" 2>&1 || true
        echo "=== Theos makefiles ==="
        ls "$THEOS/makefiles/" 2>&1 | head -10

    - name: Link Xcode SDK
      run: |
        mkdir -p "$THEOS/sdks"
        XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
        if [ -z "$XCODE_SDK" ] || [ ! -d "$XCODE_SDK" ]; then
          XCODE_SDK=$(ls -d /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk 2>/dev/null | head -1 || true)
        fi
        if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
          SDK_BASENAME=$(basename "$XCODE_SDK")
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/$SDK_BASENAME"
          echo "Linked: $SDK_BASENAME"
        else
          echo "No SDK found!"
        fi
        ls -la "$THEOS/sdks/"

    - name: Build
      run: |
        export THEOS=${{ github.workspace }}/theos
        export PATH=$THEOS/bin:$PATH
        echo "=== Verify Theos ==="
        ls "$THEOS/makefiles/common.mk" 2>&1 || echo "common.mk NOT FOUND"
        ls "$THEOS/makefiles/tweak.mk" 2>&1 || echo "tweak.mk NOT FOUND"
        echo "=== SDKs ==="
        ls "$THEOS/sdks/" 2>&1
        echo "=== make clean ==="
        make clean 2>&1 || true
        echo "=== make package ==="
        make package FINALPACKAGE=1 2>&1
        echo "=== result ==="
        ls -lh packages/ 2>&1

    - name: Package artifacts
      if: success()
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb | head -1)
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb
        tar -xf data.tar.* 2>/dev/null || true
        find . -name "*.dylib" -exec cp {} VCam.dylib \; 2>/dev/null || true
        ls -lh

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: VCam-deb
        path: output/*.deb

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: VCam-dylib
        path: output/VCam.dylib
