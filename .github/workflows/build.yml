name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid xz
      timeout-minutes: 10

    - name: Install Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 15

    - name: Setup iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        # Use Xcode's built-in iPhoneOS SDK (most reliable on macOS runners)
        XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
        if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
          SDK_NAME=$(basename "$XCODE_SDK")
          ln -sf "$XCODE_SDK" "$HOME/theos/sdks/$SDK_NAME"
          echo "Symlinked Xcode SDK: $SDK_NAME"
        else
          echo "Xcode SDK not found, trying download..."
          # Fallback: download from theos/sdks latest release via API
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/theos/sdks/releases/latest \
            | grep "browser_download_url.*iPhoneOS.*\.tar\.xz" \
            | head -1 | cut -d '"' -f 4)
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "Downloading from: $DOWNLOAD_URL"
            curl -fsSL "$DOWNLOAD_URL" -o /tmp/sdk.tar.xz
            tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
          else
            echo "ERROR: Could not obtain any SDK!"
            exit 1
          fi
        fi
        echo "Available SDKs:"
        ls -la $HOME/theos/sdks/
      timeout-minutes: 10

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        make clean
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 20

    - name: Extract artifacts
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null
        if [ -f data.tar.xz ]; then
          tar -xf data.tar.xz
        elif [ -f data.tar.gz ]; then
          tar -xf data.tar.gz
        elif [ -f data.tar.zst ]; then
          tar -xf data.tar.zst
        fi
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30
