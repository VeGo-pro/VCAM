name: Build VCam

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Diagnose environment
      run: |
        echo "=== xcode-select ==="
        xcode-select -p 2>&1 || true
        echo "=== Xcode version ==="
        xcodebuild -version 2>&1 || true
        echo "=== iPhoneOS SDKs (Xcode.app) ==="
        ls /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ 2>&1 || true
        echo "=== xcrun iphoneos sdk path ==="
        xcrun --sdk iphoneos --show-sdk-path 2>&1 || true
        echo "=== all sdks via xcodebuild ==="
        xcodebuild -showsdks 2>&1 | head -30 || true
        echo "=== tools ==="
        which clang make tar cpio gzip xcrun 2>&1 || true

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        rm -rf "$THEOS"
        git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
        cd "$THEOS"
        git submodule update --init --recursive
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
        echo "Theos installed, sdks dir:"
        ls "$THEOS/sdks/" 2>&1 || true

    - name: Setup SDK
      run: |
        mkdir -p "$THEOS/sdks"
        # Try xcrun first
        XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
        if [ -z "$XCODE_SDK" ] || [ ! -d "$XCODE_SDK" ]; then
          # Fallback: search common paths
          XCODE_SDK=$(ls -d /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk 2>/dev/null | head -1 || true)
        fi
        if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK" ]; then
          SDK_BASENAME=$(basename "$XCODE_SDK")
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/$SDK_BASENAME"
          echo "Linked SDK: $SDK_BASENAME -> $XCODE_SDK"
        else
          echo "WARNING: No iPhoneOS SDK found on system"
        fi
        echo "Theos sdks:"
        ls -la "$THEOS/sdks/" 2>&1 || true

    - name: Build package
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        echo "=== THEOS=$THEOS ==="
        echo "=== Available SDKs ==="
        ls "$THEOS/sdks/" 2>&1 || true
        echo "=== make clean ==="
        make clean 2>&1 || true
        echo "=== make package (verbose) ==="
        make package FINALPACKAGE=1 V=1 2>&1
        echo "=== Build result ==="
        ls -lh packages/ 2>&1 || echo "No packages dir"

    - name: Extract artifacts
      if: success()
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then echo "No deb!"; exit 1; fi
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb
        tar -xf data.tar.* 2>/dev/null || true
        find . -name "*.dylib" -exec cp {} VCam.dylib \; 2>/dev/null || true
        ls -lh

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: VCam-deb
        path: output/*.deb

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: VCam-dylib
        path: output/VCam.dylib
