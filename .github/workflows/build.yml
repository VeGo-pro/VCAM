name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid xz
      timeout-minutes: 10

    - name: Install Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 15

    - name: Install iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        # Try release tarball first, fall back to git clone
        SDK_TARBALL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
        if curl -fsSL "$SDK_TARBALL" -o /tmp/sdk.tar.xz 2>/dev/null; then
          echo "Downloaded SDK from release"
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
        else
          echo "Release tarball unavailable, cloning sdks repo..."
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          # Copy the newest available SDK
          LATEST_SDK=$(ls -d /tmp/theos-sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_SDK" ]; then
            echo "ERROR: No SDK found in repo!"
            exit 1
          fi
          echo "Using SDK: $LATEST_SDK"
          cp -r "$LATEST_SDK" $HOME/theos/sdks/
        fi
        echo "Installed SDKs:"
        ls $HOME/theos/sdks/
      timeout-minutes: 15

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        make clean
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 20

    - name: Extract artifacts
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        # Extract dylib from deb
        cd output
        ar x ../packages/*.deb 2>/dev/null
        if [ -f data.tar.xz ]; then
          tar -xf data.tar.xz
        elif [ -f data.tar.gz ]; then
          tar -xf data.tar.gz
        elif [ -f data.tar.zst ]; then
          tar -xf data.tar.zst
        fi
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30
